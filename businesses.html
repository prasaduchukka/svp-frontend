<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Businesses — Smart Village Portal</title>
<link rel="stylesheet" href="style.css">
</head><body>
<script src="config.js"></script><script src="lang.js"></script><script src="navbar.js"></script>
<script>renderNav("businesses")</script>
<div class="page">
  <div class="page-header">
    <h1>🛒 <span id="pageTitle"></span></h1>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-ghost" id="searchProdBtn" onclick="openProductSearch()"></button>
      <button class="btn btn-primary" id="addBizBtn" style="display:none" onclick="openBizModal()"></button>
    </div>
  </div>
  <div class="search-bar">
    <input id="searchInput" oninput="filterShops()"/>
    <select id="catFilter" onchange="filterShops()"></select>
  </div>
  <div id="listWrap"></div>
</div>

<div class="modal-overlay hidden" id="bizModal">
  <div class="modal">
    <div class="modal-header"><h2 id="bizModalTitle"></h2><button class="modal-close" onclick="closeBizModal()">✕</button></div>
    <div class="form-row">
      <div class="form-group"><label id="lbl-shop"></label><input id="bShop"/></div>
      <div class="form-group"><label id="lbl-owner"></label><input id="bOwner"/></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label id="lbl-phone"></label><input id="bPhone"/></div>
      <div class="form-group"><label id="lbl-cat"></label><select id="bCat"></select></div>
    </div>
    <div class="form-group"><label id="lbl-addr"></label><input id="bAddr"/></div>
    <div class="form-row">
      <div class="form-group"><label id="lbl-opens"></label><input id="bOpen"/></div>
      <div class="form-group"><label id="lbl-closes"></label><input id="bClose"/></div>
    </div>
    <div class="form-group"><label id="lbl-desc"></label><textarea id="bDesc"></textarea></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="btnCancel" onclick="closeBizModal()"></button>
      <button class="btn btn-primary" id="btnSave" onclick="saveBiz()"></button>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="prodModal">
  <div class="modal">
    <div class="modal-header"><h2 id="prodModalTitle"></h2><button class="modal-close" onclick="document.getElementById('prodModal').classList.add('hidden')">✕</button></div>
    <div class="form-row">
      <div class="form-group"><label id="lbl-pname"></label><input id="pName"/></div>
      <div class="form-group"><label id="lbl-price"></label><input id="pPrice" type="number" step="0.01"/></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label id="lbl-unit"></label><input id="pUnit"/></div>
      <div class="form-group"><label id="lbl-avail"></label>
        <select id="pAvail"></select>
      </div>
    </div>
    <div class="form-group"><label id="lbl-pdesc"></label><textarea id="pDesc"></textarea></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="btnCancelP" onclick="document.getElementById('prodModal').classList.add('hidden')"></button>
      <button class="btn btn-primary" id="btnSaveP" onclick="saveProduct()"></button>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="searchProdModal">
  <div class="modal modal-wide">
    <div class="modal-header"><h2 id="searchProdTitle"></h2><button class="modal-close" onclick="document.getElementById('searchProdModal').classList.add('hidden')">✕</button></div>
    <div class="form-group"><input id="prodSearchInput" oninput="searchProducts()"/></div>
    <div id="prodSearchResults"></div>
    <div class="modal-footer"><button class="btn btn-ghost" id="btnCloseSearch" onclick="document.getElementById('searchProdModal').classList.add('hidden')"></button></div>
  </div>
</div>

<div class="modal-overlay hidden" id="infoModal">
  <div class="modal modal-wide">
    <div class="modal-header"><h2 id="infoModalTitle"></h2><button class="modal-close" onclick="document.getElementById('infoModal').classList.add('hidden')">✕</button></div>
    <div id="infoModalBody" style="max-height:58vh;overflow-y:auto"></div>
    <div class="modal-footer"><button class="btn btn-ghost" onclick="document.getElementById('infoModal').classList.add('hidden')" id="btnCloseInfo"></button></div>
  </div>
</div>

<script>
let allBusinesses=[],editBizId=null,currentBizId=null,editProdId=null;

const cats=[
  ["GROCERY",getLang()==="te"?"కిరాణా":"Grocery"],
  ["PHARMACY",getLang()==="te"?"ఫార్మసీ":"Pharmacy"],
  ["VEGETABLES_FRUITS",getLang()==="te"?"కూరగాయలు & పళ్ళు":"Vegetables & Fruits"],
  ["DAIRY",getLang()==="te"?"పాల ఉత్పత్తులు":"Dairy"],
  ["HARDWARE",getLang()==="te"?"హార్డ్‌వేర్":"Hardware"],
  ["CLOTHING",getLang()==="te"?"దుస్తులు":"Clothing"],
  ["ELECTRONICS",getLang()==="te"?"ఎలక్ట్రానిక్స్":"Electronics"],
  ["AGRICULTURE_SUPPLIES",getLang()==="te"?"వ్యవసాయ సామగ్రి":"Agriculture Supplies"],
  ["RESTAURANT",getLang()==="te"?"రెస్టారెంట్":"Restaurant"],
  ["BAKERY",getLang()==="te"?"బేకరీ":"Bakery"],
  ["OTHER",t("other")]
];
const catEmoji={GROCERY:"🛒",PHARMACY:"💊",VEGETABLES_FRUITS:"🥦",DAIRY:"🥛",HARDWARE:"🔧",CLOTHING:"👕",ELECTRONICS:"📱",AGRICULTURE_SUPPLIES:"🌾",RESTAURANT:"🍽️",BAKERY:"🍞",OTHER:"🏪"};

function applyLang(){
  document.getElementById("pageTitle").textContent    = t("businesses");
  document.getElementById("searchProdBtn").textContent= "🔍 " + t("search_products");
  document.getElementById("addBizBtn").textContent    = t("add_shop");
  document.getElementById("searchInput").placeholder  = t("search_by_name");
  document.getElementById("lbl-shop").textContent     = t("shop_name");
  document.getElementById("lbl-owner").textContent    = t("owner_name");
  document.getElementById("lbl-phone").textContent    = t("phone");
  document.getElementById("lbl-cat").textContent      = t("category");
  document.getElementById("lbl-addr").textContent     = t("address");
  document.getElementById("lbl-opens").textContent    = t("opens_at");
  document.getElementById("lbl-closes").textContent   = t("closes_at");
  document.getElementById("lbl-desc").textContent     = t("description");
  document.getElementById("btnCancel").textContent    = t("cancel");
  document.getElementById("btnSave").textContent      = t("save");
  document.getElementById("lbl-pname").textContent    = getLang()==="te"?"ఉత్పత్తి పేరు":"Product Name";
  document.getElementById("lbl-price").textContent    = t("price");
  document.getElementById("lbl-unit").textContent     = t("unit");
  document.getElementById("lbl-avail").textContent    = t("available");
  document.getElementById("lbl-pdesc").textContent    = t("description");
  document.getElementById("btnCancelP").textContent   = t("cancel");
  document.getElementById("btnSaveP").textContent     = t("save");
  document.getElementById("searchProdTitle").textContent = "🔍 " + t("search_products");
  document.getElementById("prodSearchInput").placeholder = getLang()==="te"?"ఉత్పత్తి పేరు టైప్ చేయండి...":"Type product name...";
  document.getElementById("btnCloseSearch").textContent  = t("close");
  document.getElementById("btnCloseInfo").textContent    = t("close");

  const catSel = document.getElementById("catFilter");
  catSel.innerHTML = `<option value="">${t("all_categories")}</option>` + cats.map(([v,l])=>`<option value="${v}">${l}</option>`).join("");

  const bCatSel = document.getElementById("bCat");
  bCatSel.innerHTML = `<option value="">${getLang()==="te"?"వర్గం ఎంచుకోండి":"Select category"}</option>` + cats.map(([v,l])=>`<option value="${v}">${l}</option>`).join("");

  document.getElementById("pAvail").innerHTML = `<option value="true">✅ ${t("in_stock")}</option><option value="false">❌ ${t("out_of_stock")}</option>`;
}
applyLang();
if(isAdmin()) document.getElementById("addBizBtn").style.display="flex";

async function load(){
  const el=document.getElementById("listWrap");
  el.innerHTML=`<div style="color:var(--muted);padding:20px">${t("loading")}</div>`;
  try{allBusinesses=await api("GET","/api/businesses");renderList(allBusinesses);}
  catch(e){el.innerHTML=`<div class="empty"><p>${e.message}</p></div>`;}
}

function renderList(list){
  const el=document.getElementById("listWrap");
  if(!list.length){el.innerHTML=`<div class="empty"><div class="ei">🛒</div><p>${t("no_businesses")}</p></div>`;return;}
  el.innerHTML='<div class="card-grid">'+list.map(b=>`
    <div class="card" style="display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div style="font-weight:700;font-size:15px">${catEmoji[b.category]||"🏪"} ${b.shopName}</div>
        <span class="badge ${b.open?"badge-green":"badge-red"}">${b.open?t("open"):t("closed")}</span>
      </div>
      <div style="font-size:13px;color:var(--muted)">👤 ${b.ownerName} · 📞 ${b.phone}</div>
      <span class="badge badge-gray">${(cats.find(c=>c[0]===b.category)||[,""])[1]||b.category}</span>
      ${b.address?`<div style="font-size:13px;color:var(--muted)">📍 ${b.address}</div>`:""}
      ${b.openTime?`<div style="font-size:13px;color:var(--muted)">🕐 ${b.openTime} – ${b.closeTime||"?"}</div>`:""}
      ${b.description?`<div style="font-size:13px;color:#444;line-height:1.5">${b.description}</div>`:""}
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">
        <button class="btn btn-sm btn-blue" onclick="viewProducts(${b.id},'${b.shopName.replace(/'/g,"\\'")}')">📦 ${t("products")}</button>
        ${isAdmin()?`
          <button class="btn btn-sm btn-amber" onclick='openBizModal(${JSON.stringify(b).replace(/"/g,"&quot;")})'>${t("edit")}</button>
          <button class="btn btn-sm ${b.open?"btn-red":"btn-primary"}" onclick="toggleOpen(${b.id})">${b.open?t("closed"):t("open")}</button>
          <button class="btn btn-sm btn-teal" onclick="openAddProduct(${b.id},'${b.shopName.replace(/'/g,"\\'")}')">＋ ${t("add_product")}</button>`:""}
      </div>
    </div>`).join('')+'</div>';
}

function filterShops(){
  const q=document.getElementById("searchInput").value.toLowerCase();
  const cat=document.getElementById("catFilter").value;
  renderList(allBusinesses.filter(b=>(!q||b.shopName.toLowerCase().includes(q)||b.ownerName.toLowerCase().includes(q))&&(!cat||b.category===cat)));
}

async function viewProducts(bizId,shopName){
  try{
    const prods=await api("GET",`/api/products/business/${bizId}`);
    const html=prods.length?prods.map(p=>`
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 13px;background:var(--bg);border-radius:10px;border:1px solid var(--border);margin-bottom:8px">
        <div>
          <div style="font-weight:600;font-size:14px">${p.name}</div>
          ${p.description?`<div style="font-size:12px;color:var(--muted)">${p.description}</div>`:""}
          ${p.unit?`<div style="font-size:12px;color:var(--muted)">${t("unit")}: ${p.unit}</div>`:""}
        </div>
        <div style="text-align:right">
          <div style="font-size:18px;font-weight:700;color:var(--green)">₹${p.price}</div>
          <span class="badge ${p.available?"badge-green":"badge-red"}">${p.available?t("in_stock"):t("out_of_stock")}</span>
          ${isAdmin()?`<div style="margin-top:4px;display:flex;gap:4px;justify-content:flex-end">
            <button class="btn btn-xs btn-amber" onclick='openEditProduct(${JSON.stringify(p).replace(/"/g,"&quot;")},${bizId})'>${t("edit")}</button>
            <button class="btn btn-xs ${p.available?"btn-red":"btn-primary"}" onclick="toggleProd(${p.id},${bizId},'${shopName.replace(/'/g,"\\'")}')">Mark ${p.available?"Out":"In"}</button>
            <button class="btn btn-xs btn-red" onclick="deleteProd(${p.id},${bizId},'${shopName.replace(/'/g,"\\'")}')">✕</button>
          </div>`:""}
        </div>
      </div>`).join(''):`<div class="empty" style="padding:24px"><div class="ei">📦</div><p>${getLang()==="te"?"ఉత్పత్తులు నమోదు చేయబడలేదు":"No products listed yet"}</p></div>`;
    document.getElementById("infoModalTitle").textContent=`📦 ${shopName}`;
    document.getElementById("infoModalBody").innerHTML=html;
    document.getElementById("infoModal").classList.remove("hidden");
  }catch(e){toast(e.message,"error");}
}

function openAddProduct(bizId,shopName){currentBizId=bizId;editProdId=null;document.getElementById("prodModalTitle").textContent=`${t("add_product")} — ${shopName}`;["pName","pUnit","pDesc"].forEach(id=>document.getElementById(id).value="");document.getElementById("pPrice").value="";document.getElementById("pAvail").value="true";document.getElementById("prodModal").classList.remove("hidden");}
function openEditProduct(p,bizId){currentBizId=bizId;editProdId=p.id;document.getElementById("prodModalTitle").textContent=t("edit");document.getElementById("pName").value=p.name;document.getElementById("pPrice").value=p.price;document.getElementById("pUnit").value=p.unit||"";document.getElementById("pDesc").value=p.description||"";document.getElementById("pAvail").value=p.available?"true":"false";document.getElementById("prodModal").classList.remove("hidden");}
async function saveProduct(){
  const body={businessId:currentBizId,name:document.getElementById("pName").value,price:parseFloat(document.getElementById("pPrice").value),unit:document.getElementById("pUnit").value,description:document.getElementById("pDesc").value,available:document.getElementById("pAvail").value==="true"};
  if(!body.name||isNaN(body.price)){toast(getLang()==="te"?"పేరు మరియు ధర అవసరం":"Name and price required","error");return;}
  try{if(editProdId)await api("PUT",`/api/products/${editProdId}`,body);else await api("POST","/api/products",body);toast(t("save"));document.getElementById("prodModal").classList.add("hidden");viewProducts(currentBizId,"Shop");}catch(e){toast(e.message,"error");}
}
async function toggleProd(id,bizId,shopName){try{await api("PUT",`/api/products/${id}/toggle-availability`);viewProducts(bizId,shopName);}catch(e){toast(e.message,"error");}}
async function deleteProd(id,bizId,shopName){if(!confirm(getLang()==="te"?"తొలగించాలా?":"Delete?"))return;try{await api("DELETE",`/api/products/${id}`);viewProducts(bizId,shopName);}catch(e){toast(e.message,"error");}}

function openProductSearch(){document.getElementById("prodSearchInput").value="";document.getElementById("prodSearchResults").innerHTML=`<div class="empty"><div class="ei">🔍</div><p>${getLang()==="te"?"వెతకడానికి టైప్ చేయండి":"Type to search"}</p></div>`;document.getElementById("searchProdModal").classList.remove("hidden");}
async function searchProducts(){
  const q=document.getElementById("prodSearchInput").value.trim();const el=document.getElementById("prodSearchResults");
  if(q.length<2){el.innerHTML=`<div class="empty"><p>${getLang()==="te"?"కనీసం 2 అక్షరాలు టైప్ చేయండి":"Type at least 2 characters"}</p></div>`;return;}
  try{
    const prods=await api("GET",`/api/products/search?name=${encodeURIComponent(q)}`);
    if(!prods.length){el.innerHTML=`<div class="empty"><p>${getLang()==="te"?"ఉత్పత్తులు కనుగొనబడలేదు":"No products found"}</p></div>`;return;}
    el.innerHTML=prods.map(p=>`
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 13px;background:var(--bg);border-radius:10px;border:1px solid var(--border);margin-bottom:8px">
        <div><div style="font-weight:600;font-size:14px">${p.name}</div><div style="font-size:12px;color:var(--muted)">🏪 ${p.shopName}${p.unit?" · "+p.unit:""}</div></div>
        <div style="text-align:right"><div style="font-size:17px;font-weight:700;color:var(--green)">₹${p.price}</div><span class="badge ${p.available?"badge-green":"badge-red"}">${p.available?t("in_stock"):t("out_of_stock")}</span></div>
      </div>`).join('');
  }catch(e){el.innerHTML=`<div class="empty"><p>${e.message}</p></div>`;}
}

function openBizModal(b=null){editBizId=b?b.id:null;document.getElementById("bizModalTitle").textContent=b?t("edit"):t("add_shop");document.getElementById("bShop").value=b?.shopName||"";document.getElementById("bOwner").value=b?.ownerName||"";document.getElementById("bPhone").value=b?.phone||"";document.getElementById("bCat").value=b?.category||"";document.getElementById("bAddr").value=b?.address||"";document.getElementById("bOpen").value=b?.openTime||"";document.getElementById("bClose").value=b?.closeTime||"";document.getElementById("bDesc").value=b?.description||"";document.getElementById("bizModal").classList.remove("hidden");}
function closeBizModal(){document.getElementById("bizModal").classList.add("hidden");}
async function saveBiz(){
  const body={shopName:document.getElementById("bShop").value,ownerName:document.getElementById("bOwner").value,phone:document.getElementById("bPhone").value,category:document.getElementById("bCat").value,address:document.getElementById("bAddr").value,openTime:document.getElementById("bOpen").value,closeTime:document.getElementById("bClose").value,description:document.getElementById("bDesc").value};
  if(!body.shopName||!body.ownerName||!body.phone||!body.category){toast(getLang()==="te"?"తప్పనిసరి ఫీల్డ్‌లు పూరించండి":"Fill required fields","error");return;}
  try{if(editBizId)await api("PUT",`/api/businesses/${editBizId}`,body);else await api("POST","/api/businesses",body);toast(t("save"));closeBizModal();load();}catch(e){toast(e.message,"error");}
}
async function toggleOpen(id){try{await api("PUT",`/api/businesses/${id}/toggle-open`);load();}catch(e){toast(e.message,"error");}}
load();
</script>
</body></html>
