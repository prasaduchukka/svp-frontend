<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Govt Schemes — Smart Village Portal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script src="config.js"></script><script src="navbar.js"></script><script>renderNav("schemes")</script>
<div class="page">
  <div class="page-header">
    <h1><span class="ph-icon">📋</span> Government Schemes</h1>
    <button class="btn btn-primary" onclick="document.getElementById('schemeModal').classList.remove('hidden')" id="addBtn" style="display:none">＋ Add Scheme</button>
  </div>

  <!-- ELIGIBILITY CHECKER -->
  <div style="background:linear-gradient(135deg,var(--green-dark),var(--teal));border-radius:var(--radius-lg);padding:28px;margin-bottom:28px;color:#fff">
    <div style="font-size:20px;font-weight:700;margin-bottom:4px">✨ Eligibility Checker</div>
    <div style="opacity:.85;font-size:13px;margin-bottom:18px">Fill your details — instantly see all government schemes you qualify for</div>
    <div style="background:rgba(255,255,255,.12);border-radius:12px;padding:20px">
      <div class="form-row">
        <div class="form-group"><label style="color:#fff">Gender *</label>
          <select id="eGender" style="background:rgba(255,255,255,.95)"><option value="">Select</option><option value="MALE">Male</option><option value="FEMALE">Female</option></select>
        </div>
        <div class="form-group"><label style="color:#fff">Age *</label>
          <input id="eAge" type="number" placeholder="Your age" min="0" max="120" style="background:rgba(255,255,255,.95)"/>
        </div>
        <div class="form-group"><label style="color:#fff">Income Category *</label>
          <select id="eIncome" style="background:rgba(255,255,255,.95)"><option value="">Select</option><option value="BPL">BPL (Below Poverty Line)</option><option value="LOW">Low Income</option><option value="MIDDLE">Middle Income</option><option value="ALL">Higher Income</option></select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label style="color:#fff">Are you a Farmer?</label>
          <select id="eFarmer" style="background:rgba(255,255,255,.95)"><option value="false">No</option><option value="true">Yes</option></select>
        </div>
        <div class="form-group"><label style="color:#fff">Own Land?</label>
          <select id="eOwnsLand" style="background:rgba(255,255,255,.95)"><option value="false">No</option><option value="true">Yes</option></select>
        </div>
        <div class="form-group"><label style="color:#fff">Caste Category</label>
          <select id="eCaste" style="background:rgba(255,255,255,.95)"><option value="none">General / OC</option><option value="scst">SC / ST</option><option value="bc">BC</option></select>
        </div>
      </div>
      <button class="btn" style="background:#fff;color:var(--green-dark);font-weight:700;padding:10px 28px;font-size:15px" onclick="checkEligibility()">🔍 Check My Eligibility</button>
    </div>
    <div id="eligibilityResults" style="margin-top:16px"></div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchCat('',this)">All</button>
    <button class="tab-btn" onclick="switchCat('FARMER',this)">🌾 Farmers</button>
    <button class="tab-btn" onclick="switchCat('WOMEN',this)">👩 Women</button>
    <button class="tab-btn" onclick="switchCat('HEALTH',this)">🏥 Health</button>
    <button class="tab-btn" onclick="switchCat('EDUCATION',this)">📚 Education</button>
    <button class="tab-btn" onclick="switchCat('HOUSING',this)">🏠 Housing</button>
    <button class="tab-btn" onclick="switchCat('EMPLOYMENT',this)">💼 Employment</button>
    <button class="tab-btn" onclick="switchCat('SENIOR_CITIZEN',this)">👴 Senior</button>
  </div>
  <div id="schemesList"></div>
</div>

<div class="modal-overlay hidden" id="schemeModal">
  <div class="modal modal-wide">
    <div class="modal-header"><h2>Add Government Scheme</h2><button class="modal-close" onclick="document.getElementById('schemeModal').classList.add('hidden')">✕</button></div>
    <div class="form-row"><div class="form-group"><label>Scheme Name *</label><input id="sName" placeholder="e.g. PM-KISAN"/></div><div class="form-group"><label>Scheme Code *</label><input id="sCode" placeholder="e.g. PM-KISAN"/></div></div>
    <div class="form-row">
      <div class="form-group"><label>Category *</label><select id="sCat"><option value="">Select</option><option>FARMER</option><option>WOMEN</option><option>YOUTH</option><option>CHILDREN</option><option>SENIOR_CITIZEN</option><option>EDUCATION</option><option>HEALTH</option><option>HOUSING</option><option>EMPLOYMENT</option><option>OTHER</option></select></div>
      <div class="form-group"><label>Target Gender</label><select id="sGender"><option value="ALL">All</option><option value="MALE">Male</option><option value="FEMALE">Female</option></select></div>
    </div>
    <div class="form-row"><div class="form-group"><label>Min Age</label><input id="sMinAge" type="number" placeholder="0"/></div><div class="form-group"><label>Max Age</label><input id="sMaxAge" type="number" placeholder="120"/></div></div>
    <div class="form-row">
      <div class="form-group"><label>Farmer Required?</label><select id="sFarmer"><option value="">No</option><option value="true">Yes</option></select></div>
      <div class="form-group"><label>Max Income</label><select id="sIncome"><option value="ALL">All</option><option value="BPL">BPL</option><option value="LOW">Low</option><option value="MIDDLE">Middle</option></select></div>
    </div>
    <div class="form-group"><label>Description *</label><textarea id="sDesc" placeholder="What this scheme is about..."></textarea></div>
    <div class="form-group"><label>Benefits</label><textarea id="sBenefits" placeholder="What the beneficiary gets..."></textarea></div>
    <div class="form-group"><label>Documents Required</label><input id="sDocs" placeholder="Aadhaar, Bank passbook..."/></div>
    <div class="form-row"><div class="form-group"><label>Application Link</label><input id="sLink" placeholder="https://..."/></div><div class="form-group"><label>Helpline</label><input id="sHelpline" placeholder="1800-xxx-xxxx"/></div></div>
    <div class="form-group"><label>Government Dept</label><input id="sDept" placeholder="Ministry of ..."/></div>
    <div class="modal-footer"><button class="btn btn-ghost" onclick="document.getElementById('schemeModal').classList.add('hidden')">Cancel</button><button class="btn btn-primary" onclick="saveScheme()">Save Scheme</button></div>
  </div>
</div>

<script>
let currentCat="";
if(isAdmin()) document.getElementById("addBtn").style.display="flex";
const catBadge={FARMER:"badge-green",WOMEN:"badge-purple",HEALTH:"badge-red",EDUCATION:"badge-blue",HOUSING:"badge-amber",EMPLOYMENT:"badge-teal",SENIOR_CITIZEN:"badge-gray",CHILDREN:"badge-gold",YOUTH:"badge-teal"};

function switchCat(cat,btn){currentCat=cat;document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));btn.classList.add("active");loadSchemes();}

async function loadSchemes(){
  const el=document.getElementById("schemesList");el.innerHTML='<div style="color:var(--muted);padding:20px">Loading...</div>';
  try{
    const path=currentCat?`/api/schemes?category=${currentCat}`:"/api/schemes";
    const data=await api("GET",path);
    if(!data.length){el.innerHTML='<div class="empty"><div class="ei">📋</div><p>No schemes found</p></div>';return;}
    el.innerHTML='<div class="card-grid">'+data.map(s=>`
      <div class="card" style="display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
          <div style="font-weight:700;font-size:15px">${s.schemeName}</div>
          <span class="badge ${catBadge[s.category]||'badge-gray'}" style="flex-shrink:0">${s.category.replace("_"," ")}</span>
        </div>
        <div style="font-size:12px;color:var(--muted)">🏷️ ${s.schemeCode} &nbsp;·&nbsp; 👤 ${s.targetGender||"ALL"} ${s.minAge||s.maxAge?'· Age: '+(s.minAge||0)+'–'+(s.maxAge||'any'):''}  ${s.farmerRequired?'· 🌾 Farmers only':''}</div>
        <div style="font-size:13px;color:#444;line-height:1.5">${s.description}</div>
        ${s.benefits?`<div style="background:#e8f5e9;padding:10px 12px;border-radius:8px;font-size:13px;border-left:3px solid var(--green)"><b>Benefits:</b> ${s.benefits}</div>`:''}
        ${s.documentsRequired?`<div style="font-size:12px;color:var(--muted)">📄 Docs: ${s.documentsRequired}</div>`:''}
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">
          ${s.applicationLink?`<a href="${s.applicationLink}" target="_blank" class="btn btn-sm btn-teal">Apply Online ↗</a>`:''}
          ${s.helplineNumber?`<span class="badge badge-blue">📞 ${s.helplineNumber}</span>`:''}
        </div>
        ${isAdmin()?`<div><button class="btn btn-xs btn-red" onclick="deleteScheme(${s.id})">Remove</button></div>`:''}
      </div>`).join('')+'</div>';
  }catch(e){el.innerHTML=`<div class="empty"><p>${e.message}</p></div>`;}
}

async function checkEligibility(){
  const gender=document.getElementById("eGender").value;
  const age=parseInt(document.getElementById("eAge").value);
  const income=document.getElementById("eIncome").value;
  const farmer=document.getElementById("eFarmer").value==="true";
  const land=document.getElementById("eOwnsLand").value==="true";
  const caste=document.getElementById("eCaste").value;
  if(!gender||!age||!income){toast("Please fill gender, age and income","error");return;}
  const body={gender,age,isFarmer:farmer,ownsLand:land,incomeCategory:income,isScSt:caste==="scst",isBc:caste==="bc",isDifferentlyAbled:false};
  const el=document.getElementById("eligibilityResults");
  el.innerHTML='<div style="color:rgba(255,255,255,.8)">Checking...</div>';
  try{
    const schemes=await api("POST","/api/schemes/check-eligibility",body);
    if(!schemes.length){el.innerHTML='<div style="background:rgba(255,255,255,.15);border-radius:10px;padding:14px;color:#fff">No schemes matched your profile. Contact the panchayat office for guidance.</div>';return;}
    el.innerHTML=`<div style="color:#fff;font-weight:700;font-size:15px;margin-bottom:10px">🎉 You qualify for ${schemes.length} scheme(s)!</div>`+
      schemes.map(s=>`
        <div style="background:rgba(255,255,255,.12);border-radius:10px;padding:14px 16px;margin-bottom:10px;border-left:3px solid rgba(255,255,255,.5)">
          <div style="font-weight:700;font-size:14px;color:#fff;margin-bottom:6px">${s.schemeName} <span style="font-size:11px;background:rgba(255,255,255,.2);padding:2px 8px;border-radius:10px">${s.category.replace("_"," ")}</span></div>
          ${s.benefits?`<div style="font-size:13px;color:rgba(255,255,255,.85);margin-bottom:6px">💰 ${s.benefits}</div>`:''}
          ${s.documentsRequired?`<div style="font-size:12px;color:rgba(255,255,255,.7);margin-bottom:6px">📄 ${s.documentsRequired}</div>`:''}
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            ${s.applicationLink?`<a href="${s.applicationLink}" target="_blank" class="btn btn-sm btn-teal">Apply Online ↗</a>`:''}
            ${s.helplineNumber?`<span style="font-size:12px;color:rgba(255,255,255,.75)">📞 ${s.helplineNumber}</span>`:''}
          </div>
        </div>`).join('');
  }catch(e){el.innerHTML=`<div style="color:#ffcdd2">${e.message}</div>`;}
}

async function saveScheme(){
  const body={schemeName:document.getElementById("sName").value,schemeCode:document.getElementById("sCode").value,category:document.getElementById("sCat").value,description:document.getElementById("sDesc").value,benefits:document.getElementById("sBenefits").value,targetGender:document.getElementById("sGender").value,minAge:document.getElementById("sMinAge").value?parseInt(document.getElementById("sMinAge").value):null,maxAge:document.getElementById("sMaxAge").value?parseInt(document.getElementById("sMaxAge").value):null,farmerRequired:document.getElementById("sFarmer").value==="true"?true:null,maxIncomeCategory:document.getElementById("sIncome").value,documentsRequired:document.getElementById("sDocs").value,applicationLink:document.getElementById("sLink").value,helplineNumber:document.getElementById("sHelpline").value,governmentDept:document.getElementById("sDept").value};
  if(!body.schemeName||!body.category||!body.description){toast("Fill required fields","error");return;}
  try{await api("POST","/api/schemes",body);toast("Scheme added!");document.getElementById("schemeModal").classList.add("hidden");loadSchemes();}catch(e){toast(e.message,"error");}
}
async function deleteScheme(id){if(!confirm("Remove this scheme?"))return;try{await api("DELETE",`/api/schemes/${id}`);toast("Removed");loadSchemes();}catch(e){toast(e.message,"error");}}
loadSchemes();
</script>
</body>
</html>
