<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Smart Village Portal</title>
<link rel="stylesheet" href="style.css">
</head><body>
<script src="config.js"></script><script src="lang.js"></script><script src="navbar.js"></script>
<script>if(!getToken()||!isAdmin()) window.location.href="login.html"; renderNav("admin");</script>
<div class="page">
  <div class="page-header">
    <h1>⚙️ <span id="pageTitle"></span></h1>
    <span class="badge badge-green" id="adminBadge"></span>
  </div>

  <div class="stats-row" id="dashStats"></div>

  <div class="section-head" style="margin-bottom:14px"><h2 id="quickTitle"></h2><div class="section-line"></div></div>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:26px">
    <a href="meetings.html"   class="module-card"><div class="mc-icon" style="background:#e8f5e9">📅</div><div class="mc-label" id="mc-meetings"></div></a>
    <a href="complaints.html" class="module-card"><div class="mc-icon" style="background:#ffebee">📢</div><div class="mc-label" id="mc-complaints"></div></a>
    <a href="businesses.html" class="module-card"><div class="mc-icon" style="background:#fff3e0">🛒</div><div class="mc-label" id="mc-businesses"></div></a>
    <a href="schemes.html"    class="module-card"><div class="mc-icon" style="background:#e3f2fd">📋</div><div class="mc-label" id="mc-schemes"></div></a>
    <a href="budget.html"     class="module-card"><div class="mc-icon" style="background:#e8f5e9">💰</div><div class="mc-label" id="mc-budget"></div></a>
    <a href="festivals.html"  class="module-card"><div class="mc-icon" style="background:#f3e5f5">🎉</div><div class="mc-label" id="mc-festivals"></div></a>
    <a href="education.html"  class="module-card"><div class="mc-icon" style="background:#e3f2fd">📚</div><div class="mc-label" id="mc-education"></div></a>
    <a href="tourists.html"   class="module-card"><div class="mc-icon" style="background:#e0f2f1">📍</div><div class="mc-label" id="mc-tourism"></div></a>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px" class="admin-grid">
    <div class="card">
      <div class="section-head" style="margin-bottom:14px"><h2 id="registerTitle"></h2></div>
      <div class="form-group"><label id="lbl-fullname"></label><input id="rFullName"/></div>
      <div class="form-group"><label id="lbl-username"></label><input id="rUsername"/></div>
      <div class="form-group"><label id="lbl-password"></label><input id="rPassword" type="password"/></div>
      <div class="form-group"><label id="lbl-phone"></label><input id="rPhone"/></div>
      <div class="form-group"><label id="lbl-role"></label>
        <select id="rRole">
          <option value="CITIZEN" id="opt-citizen"></option>
          <option value="BUSINESS_OWNER" id="opt-biz"></option>
          <option value="PANCHAYAT" id="opt-panch"></option>
          <option value="ADMIN" id="opt-admin"></option>
        </select>
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center" id="registerBtn" onclick="registerUser()"></button>
    </div>

    <div class="card">
      <div class="section-head" style="margin-bottom:14px"><h2 id="pendingTitle"></h2><div class="section-line"></div><a href="complaints.html" style="font-size:12px;color:var(--green);text-decoration:none" id="viewAllLink"></a></div>
      <div id="pendingComplaints"><div style="color:var(--muted);font-size:13px" id="loadingText"></div></div>
    </div>
  </div>
</div>

<style>
@media(max-width:640px){.admin-grid{grid-template-columns:1fr!important}}
</style>

<script>
const user=getUser();
if(user) document.getElementById("adminBadge").textContent=`${user.fullName} — ${user.role}`;

function applyLang(){
  document.getElementById("pageTitle").textContent     = t("admin_dash");
  document.getElementById("quickTitle").textContent    = t("quick_actions");
  document.getElementById("mc-meetings").textContent   = t("meetings");
  document.getElementById("mc-complaints").textContent = t("complaints");
  document.getElementById("mc-businesses").textContent = t("businesses");
  document.getElementById("mc-schemes").textContent    = t("schemes");
  document.getElementById("mc-budget").textContent     = t("budget");
  document.getElementById("mc-festivals").textContent  = t("festivals");
  document.getElementById("mc-education").textContent  = t("education");
  document.getElementById("mc-tourism").textContent    = t("tourism");
  document.getElementById("registerTitle").textContent = t("register_user");
  document.getElementById("lbl-fullname").textContent  = t("full_name");
  document.getElementById("lbl-username").textContent  = t("username");
  document.getElementById("lbl-password").textContent  = t("password");
  document.getElementById("lbl-phone").textContent     = t("phone");
  document.getElementById("lbl-role").textContent      = t("role");
  document.getElementById("registerBtn").textContent   = t("register_btn");
  document.getElementById("pendingTitle").textContent  = t("pending_complaints");
  document.getElementById("viewAllLink").textContent   = t("view_all");
  document.getElementById("loadingText").textContent   = t("loading");
  document.getElementById("opt-citizen").textContent   = getLang()==="te"?"సిటిజన్ (చదవడం మాత్రమే)":"Citizen (read-only)";
  document.getElementById("opt-biz").textContent       = getLang()==="te"?"వ్యాపారి":"Business Owner";
  document.getElementById("opt-panch").textContent     = getLang()==="te"?"పంచాయతీ సిబ్బంది":"Panchayat Staff";
  document.getElementById("opt-admin").textContent     = getLang()==="te"?"నిర్వాహకుడు":"Admin";
  document.getElementById("rFullName").placeholder     = getLang()==="te"?"పూర్తి పేరు":"Full name";
  document.getElementById("rUsername").placeholder     = getLang()==="te"?"వినియోగదారు పేరు":"Username";
  document.getElementById("rPassword").placeholder     = getLang()==="te"?"కనీసం 6 అక్షరాలు":"Min 6 characters";
  document.getElementById("rPhone").placeholder        = getLang()==="te"?"ఫోన్ నంబర్":"Phone number";
}
applyLang();

async function loadDash(){
  try{
    const [meetings,complaints,businesses,schemes,budget]=await Promise.all([
      api("GET","/api/meetings"),api("GET","/api/complaints"),
      api("GET","/api/businesses"),api("GET","/api/schemes"),api("GET","/api/budget")
    ]);
    const pending=complaints.filter(c=>c.status==="PENDING");
    const resolved=complaints.filter(c=>c.status==="RESOLVED");
    const openBiz=businesses.filter(b=>b.open);

    document.getElementById("dashStats").innerHTML=`
      <div class="stat-card"><div class="stat-icon" style="background:#e8f5e9">📅</div><div><div class="stat-val" style="color:var(--green)">${meetings.length}</div><div class="stat-lbl">${t("meetings")}</div></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:#ffebee">🔴</div><div><div class="stat-val" style="color:var(--red)">${pending.length}</div><div class="stat-lbl">${t("pending_complaints")}</div></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:#e8f5e9">✅</div><div><div class="stat-val" style="color:var(--green)">${resolved.length}</div><div class="stat-lbl">${t("resolved")}</div></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:#fff3e0">🛒</div><div><div class="stat-val" style="color:var(--amber)">${openBiz.length}</div><div class="stat-lbl">${getLang()==="te"?"తెరిచిన దుకాణాలు":"Open Shops"}</div></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:#e3f2fd">📋</div><div><div class="stat-val" style="color:var(--blue)">${schemes.length}</div><div class="stat-lbl">${t("schemes")}</div></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:#f3e5f5">💰</div><div><div class="stat-val" style="color:var(--purple)">${budget.length}</div><div class="stat-lbl">${t("budget")}</div></div></div>`;

    const pc=document.getElementById("pendingComplaints");
    if(!pending.length){
      pc.innerHTML=`<div class="empty" style="padding:20px"><div class="ei">✅</div><p>${getLang()==="te"?"పెండింగ్ ఫిర్యాదులు లేవు!":"No pending complaints!"}</p></div>`;
    } else {
      pc.innerHTML='<div style="display:flex;flex-direction:column;gap:8px;max-height:300px;overflow-y:auto">'+
        pending.slice(0,8).map(c=>`
          <div style="padding:10px 12px;background:var(--bg);border-radius:10px;border-left:3px solid var(--amber);border:1px solid var(--border)">
            <div style="font-weight:600;font-size:13px">${c.subject}</div>
            <div style="font-size:12px;color:var(--muted);margin-top:2px">${c.category.replace("_"," ")} · ${c.complainantName}</div>
            <div style="font-size:12px;color:var(--muted)">${formatDate(c.createdAt)}</div>
            <a href="complaints.html" class="btn btn-xs btn-amber" style="margin-top:6px">${getLang()==="te"?"పరిష్కరించు →":"Resolve →"}</a>
          </div>`).join('')+'</div>'+
        (pending.length>8?`<div style="font-size:12px;color:var(--muted);margin-top:8px">+${pending.length-8} ${getLang()==="te"?"మరిన్ని ఫిర్యాదులు":"more complaints"}</div>`:'');
    }
  }catch(e){console.error(e);}
}

async function registerUser(){
  const body={fullName:document.getElementById("rFullName").value,username:document.getElementById("rUsername").value,password:document.getElementById("rPassword").value,phone:document.getElementById("rPhone").value,role:document.getElementById("rRole").value};
  if(!body.fullName||!body.username||!body.password){toast(getLang()==="te"?"తప్పనిసరి ఫీల్డ్‌లు పూరించండి":"Fill required fields","error");return;}
  if(body.password.length<6){toast(getLang()==="te"?"పాస్‌వర్డ్ కనీసం 6 అక్షరాలు ఉండాలి":"Password must be at least 6 characters","error");return;}
  try{
    await api("POST","/api/auth/register",body);
    toast(getLang()==="te"?`'${body.username}' విజయవంతంగా నమోదు చేయబడింది!`:`User '${body.username}' registered as ${body.role}!`);
    ["rFullName","rUsername","rPassword","rPhone"].forEach(id=>document.getElementById(id).value="");
  }catch(e){toast(e.message,"error");}
}
loadDash();
</script>
</body></html>
