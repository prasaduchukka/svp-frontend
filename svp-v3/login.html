<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — Smart Village Portal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script src="config.js"></script>
<script src="lang.js"></script>
<script>if(getToken()) window.location.href="index.html";</script>

<div class="login-wrap">
  <div class="login-left">
    <div style="font-size:44px;margin-bottom:14px">🏡</div>
    <h1 id="ll-title">Smart Village Portal</h1>
    <p id="ll-sub">Chinabhogili Village, Seethanagaram Mandal, Vizianagaram</p>
    <div class="quote-block" id="ll-quote"></div>
    <div style="margin-top:24px;display:flex;gap:12px;flex-wrap:wrap">
      <div style="background:rgba(255,255,255,.12);border-radius:10px;padding:12px 16px;text-align:center"><div style="font-size:20px;font-weight:700">9</div><div style="font-size:12px;opacity:.75" id="ll-modules">Modules</div></div>
      <div style="background:rgba(255,255,255,.12);border-radius:10px;padding:12px 16px;text-align:center"><div style="font-size:20px;font-weight:700">12+</div><div style="font-size:12px;opacity:.75" id="ll-schemes">Govt Schemes</div></div>
      <div style="background:rgba(255,255,255,.12);border-radius:10px;padding:12px 16px;text-align:center"><div style="font-size:20px;font-weight:700">4</div><div style="font-size:12px;opacity:.75" id="ll-roles">User Roles</div></div>
    </div>
  </div>

  <div class="login-right">
    <div class="login-lang">
      <button onclick="toggleLang()" id="langToggleBtn"></button>
    </div>
    <div style="font-size:32px;margin-bottom:10px">👋</div>
    <h2 id="lr-welcome">Welcome back</h2>
    <p class="sub" id="lr-sub">Sign in to manage village services</p>

    <div class="form-group">
      <label id="lbl-user">Username</label>
      <input type="text" id="username" autofocus/>
    </div>
    <div class="form-group">
      <label id="lbl-pass">Password</label>
      <input type="password" id="password"/>
    </div>
    <div id="err" style="color:#b71c1c;font-size:13px;margin-bottom:10px;min-height:18px"></div>
    <button class="btn btn-primary" id="signInBtn" style="width:100%;justify-content:center;padding:11px;font-size:15px" onclick="doLogin()"></button>
    <p style="text-align:center;margin-top:16px;font-size:13px;color:var(--muted)">
      <a href="index.html" id="publicLink" style="color:var(--green)"></a>
    </p>
  </div>
</div>

<script>
function applyLang() {
  document.getElementById("ll-title").textContent    = getLang()==="te" ? "స్మార్ట్ విలేజ్ పోర్టల్" : "Smart Village Portal";
  document.getElementById("ll-sub").textContent      = getLang()==="te" ? "చినభోగిలి గ్రామం, సీతానగరం మండలం, విజయనగరం" : "Chinabhogili Village, Seethanagaram Mandal, Vizianagaram";
  document.getElementById("ll-quote").innerHTML      = getLang()==="te"
    ? `<span style="font-size:16px;font-weight:600">మన గ్రామ ప్రజలు బాధ్యతగా, పారదర్శకంగా మరియు ఐకమత్యంగా ఉండాలని నా కోరిక.</span>`
    : `<span style="font-style:italic">"My wish is that the people of our village be responsible, transparent and united."</span>`;
  document.getElementById("ll-modules").textContent  = getLang()==="te" ? "మాడ్యూళ్లు" : "Modules";
  document.getElementById("ll-schemes").textContent  = getLang()==="te" ? "పథకాలు" : "Govt Schemes";
  document.getElementById("ll-roles").textContent    = getLang()==="te" ? "పాత్రలు" : "User Roles";
  document.getElementById("lr-welcome").textContent  = t("welcome_back");
  document.getElementById("lr-sub").textContent      = getLang()==="te" ? "గ్రామ సేవలు నిర్వహించడానికి లాగిన్ చేయండి" : "Sign in to manage village services";
  document.getElementById("lbl-user").textContent    = t("username");
  document.getElementById("lbl-pass").textContent    = t("password");
  document.getElementById("signInBtn").textContent   = t("sign_in");
  document.getElementById("publicLink").textContent  = t("view_portal");
  document.getElementById("langToggleBtn").textContent = getLang()==="te" ? "🇮🇳 English" : "🇮🇳 తెలుగు";
  document.getElementById("username").placeholder    = t("username");
  document.getElementById("password").placeholder    = t("password");
}
applyLang();
document.addEventListener("keydown", e => { if(e.key==="Enter") doLogin(); });
async function doLogin() {
  const u=document.getElementById("username").value.trim();
  const p=document.getElementById("password").value.trim();
  const err=document.getElementById("err");
  err.textContent="";
  if(!u||!p){err.textContent=getLang()==="te"?"దయచేసి వినియోగదారు పేరు మరియు పాస్‌వర్డ్ నమోదు చేయండి":"Please enter username and password";return;}
  try{
    const data=await api("POST","/api/auth/login",{username:u,password:p});
    localStorage.setItem("svp_token",data.token);
    localStorage.setItem("svp_user",JSON.stringify({username:data.username,fullName:data.fullName,role:data.role}));
    window.location.href="index.html";
  }catch(e){err.textContent=e.message;}
}
</script>
</body>
</html>
