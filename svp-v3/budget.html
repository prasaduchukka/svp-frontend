<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Budget — Smart Village Portal</title>
<link rel="stylesheet" href="style.css">
</head><body>
<script src="config.js"></script><script src="lang.js"></script><script src="navbar.js"></script>
<script>renderNav("budget")</script>
<div class="page">
  <div class="page-header">
    <h1>💰 <span id="pageTitle"></span></h1>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <select id="yearFilter" onchange="loadAll()" style="padding:9px 12px;border:1.5px solid var(--border);border-radius:9px;font-size:14px;background:#fff">
        <option value="2024-25">2024-25</option>
        <option value="2023-24">2023-24</option>
        <option value="2025-26">2025-26</option>
      </select>
      <button class="btn btn-primary" id="addBtn" style="display:none" onclick="openModal()"></button>
    </div>
  </div>
  <div class="stats-row" id="summary"></div>
  <div class="card" style="margin-bottom:22px" id="progressCard"></div>
  <div class="section-head" style="margin-bottom:14px"><h2 id="allProjectsTitle"></h2><div class="section-line"></div></div>
  <div class="tabs" id="statusTabs"></div>
  <div id="projectList"></div>
</div>

<div class="modal-overlay hidden" id="modal">
  <div class="modal">
    <div class="modal-header"><h2 id="modalTitle"></h2><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="form-row">
      <div class="form-group"><label id="lbl-year"></label>
        <select id="fYear"><option value="2024-25">2024-25</option><option value="2023-24">2023-24</option><option value="2025-26">2025-26</option></select>
      </div>
      <div class="form-group"><label id="lbl-cat"></label>
        <select id="fCat"><option value="" id="opt-select"></option></select>
      </div>
    </div>
    <div class="form-group"><label id="lbl-project"></label><input id="fProject"/></div>
    <div class="form-group"><label id="lbl-desc"></label><textarea id="fDesc"></textarea></div>
    <div class="form-row">
      <div class="form-group"><label id="lbl-alloc"></label><input id="fAlloc" type="number"/></div>
      <div class="form-group"><label id="lbl-spent"></label><input id="fSpent" type="number"/></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label id="lbl-status"></label>
        <select id="fStatus">
          <option value="PLANNED" id="opt-planned"></option>
          <option value="IN_PROGRESS" id="opt-progress"></option>
          <option value="COMPLETED" id="opt-completed"></option>
          <option value="ON_HOLD" id="opt-hold"></option>
        </select>
      </div>
      <div class="form-group"><label id="lbl-fund"></label><input id="fFund"/></div>
    </div>
    <div class="form-group"><label id="lbl-remarks"></label><input id="fRemarks"/></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="btnCancel" onclick="closeModal()"></button>
      <button class="btn btn-primary" id="btnSave" onclick="saveProject()"></button>
    </div>
  </div>
</div>

<script>
let allProjects=[],currentStatusFilter="",editId=null;
if(isAdmin()) document.getElementById("addBtn").style.display="flex";

const budgetCats=[
  ["ROADS",getLang()==="te"?"రోడ్లు":"Roads"],
  ["DRINKING_WATER",getLang()==="te"?"తాగునీరు":"Drinking Water"],
  ["DRAINAGE",getLang()==="te"?"మురుగు":"Drainage"],
  ["ELECTRICITY",getLang()==="te"?"విద్యుత్":"Electricity"],
  ["SANITATION",getLang()==="te"?"పారిశుధ్యం":"Sanitation"],
  ["SCHOOL_DEVELOPMENT",getLang()==="te"?"పాఠశాల అభివృద్ధి":"School Development"],
  ["HEALTH_CENTER",getLang()==="te"?"ఆరోగ్య కేంద్రం":"Health Center"],
  ["COMMUNITY_HALL",getLang()==="te"?"కమ్యూనిటీ హాల్":"Community Hall"],
  ["STREET_LIGHTS",getLang()==="te"?"వీధి దీపాలు":"Street Lights"],
  ["AGRICULTURE",getLang()==="te"?"వ్యవసాయం":"Agriculture"],
  ["WOMEN_WELFARE",getLang()==="te"?"మహిళా సంక్షేమం":"Women Welfare"],
  ["SPORTS",getLang()==="te"?"క్రీడలు":"Sports"],
  ["OTHER",t("other")]
];
const statusBadge={PLANNED:"badge-gray",IN_PROGRESS:"badge-blue",COMPLETED:"badge-green",ON_HOLD:"badge-amber",CANCELLED:"badge-red"};

function applyLang(){
  document.getElementById("pageTitle").textContent     = t("budget_title");
  document.getElementById("addBtn").textContent        = "＋ " + t("add_project");
  document.getElementById("allProjectsTitle").textContent = "📂 " + t("all_projects");
  document.getElementById("modalTitle").textContent    = t("add_project");
  document.getElementById("lbl-year").textContent      = t("financial_year");
  document.getElementById("lbl-cat").textContent       = t("category");
  document.getElementById("lbl-project").textContent   = t("project_name");
  document.getElementById("lbl-desc").textContent      = t("description");
  document.getElementById("lbl-alloc").textContent     = t("allocated") + " (₹)";
  document.getElementById("lbl-spent").textContent     = t("spent") + " (₹)";
  document.getElementById("lbl-status").textContent    = t("status");
  document.getElementById("lbl-fund").textContent      = t("fund_source");
  document.getElementById("lbl-remarks").textContent   = t("remarks");
  document.getElementById("btnCancel").textContent     = t("cancel");
  document.getElementById("btnSave").textContent       = t("save");
  document.getElementById("opt-planned").textContent   = t("planned");
  document.getElementById("opt-progress").textContent  = t("in_progress");
  document.getElementById("opt-completed").textContent = t("completed");
  document.getElementById("opt-hold").textContent      = t("on_hold");
  document.getElementById("opt-select").textContent    = getLang()==="te"?"వర్గం ఎంచుకోండి":"Select category";
  document.getElementById("fCat").innerHTML = `<option value="">${getLang()==="te"?"వర్గం ఎంచుకోండి":"Select category"}</option>` + budgetCats.map(([v,l])=>`<option value="${v}">${l}</option>`).join("");

  const tabs=[["","",t("all")],["PLANNED","",t("planned")],["IN_PROGRESS","",t("in_progress")],["COMPLETED","",t("completed")]];
  document.getElementById("statusTabs").innerHTML=tabs.map(([v,,l],i)=>
    `<button class="tab-btn ${i===0?"active":""}" onclick="filterStatus('${v}',this)">${l}</button>`
  ).join("");
}
applyLang();

async function loadAll(){
  const year=document.getElementById("yearFilter").value;
  try{
    const [summary,projects]=await Promise.all([api("GET",`/api/budget/summary?year=${year}`),api("GET",`/api/budget?year=${year}`)]);
    allProjects=projects;renderSummary(summary);renderProjects(allProjects);
  }catch(e){toast(e.message,"error");}
}

function renderSummary(s){
  const pct=s.totalAllocated>0?Math.min(100,Math.round((s.totalSpent/s.totalAllocated)*100)):0;
  const barColor=pct>90?"var(--red)":pct>60?"var(--amber)":"var(--green)";
  document.getElementById("summary").innerHTML=`
    <div class="stat-card"><div class="stat-icon" style="background:#e8f5e9">💰</div><div><div class="stat-val" style="color:var(--green)">${rupee(s.totalAllocated)}</div><div class="stat-lbl">${t("total_allocated")}</div></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:#ffebee">💸</div><div><div class="stat-val" style="color:var(--red)">${rupee(s.totalSpent)}</div><div class="stat-lbl">${t("total_spent")}</div></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:#e3f2fd">💵</div><div><div class="stat-val" style="color:var(--blue)">${rupee(s.totalRemaining)}</div><div class="stat-lbl">${t("remaining")}</div></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:#f3e5f5">📁</div><div><div class="stat-val" style="color:var(--purple)">${s.totalProjects}</div><div class="stat-lbl">${t("total_projects")}</div></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:#e8f5e9">✅</div><div><div class="stat-val" style="color:var(--green)">${s.completedProjects}</div><div class="stat-lbl">${t("completed")}</div></div></div>`;
  document.getElementById("progressCard").innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px">
      <div><div style="font-size:15px;font-weight:600">${t("budget_util")} — ${s.financialYear}</div></div>
      <div style="font-size:28px;font-weight:700;color:${barColor}">${pct}%</div>
    </div>
    <div class="prog-bg"><div class="prog-fill" style="width:${pct}%;background:${barColor}"></div></div>
    <div style="display:flex;justify-content:space-between;margin-top:5px;font-size:12px;color:var(--muted)">
      <span>₹0</span><span>${t("spent")}: ${rupee(s.totalSpent)}</span><span>${rupee(s.totalAllocated)}</span>
    </div>`;
}

function filterStatus(s,btn){currentStatusFilter=s;document.querySelectorAll("#statusTabs .tab-btn").forEach(b=>b.classList.remove("active"));btn.classList.add("active");renderProjects(allProjects);}

function renderProjects(list){
  const filtered=currentStatusFilter?list.filter(p=>p.status===currentStatusFilter):list;
  const el=document.getElementById("projectList");
  if(!filtered.length){el.innerHTML=`<div class="empty"><div class="ei">💰</div><p>${t("nodata")}</p></div>`;return;}
  el.innerHTML='<div class="card-grid">'+filtered.map(p=>{
    const spent=parseFloat(p.spentAmount)||0;const alloc=parseFloat(p.allocatedAmount)||1;
    const pct=Math.min(100,Math.round((spent/alloc)*100));const barColor=pct>90?"var(--red)":"var(--green)";
    const catLabel=(budgetCats.find(c=>c[0]===p.category)||["","",p.category])[1]||p.category;
    return `<div class="card" style="display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
        <div style="font-weight:700;font-size:14px">${p.projectName}</div>
        <span class="badge ${statusBadge[p.status]||"badge-gray"}" style="flex-shrink:0">${p.status.replace("_"," ")}</span>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap"><span class="badge badge-gray">${catLabel}</span><span class="badge badge-teal">${p.financialYear}</span></div>
      ${p.description?`<div style="font-size:13px;color:#444">${p.description}</div>`:""}
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:4px">
        <div style="text-align:center;padding:8px;background:var(--bg);border-radius:8px"><div style="font-size:11px;color:var(--muted)">${t("allocated")}</div><div style="font-weight:700;color:var(--green);font-size:13px">${rupee(p.allocatedAmount)}</div></div>
        <div style="text-align:center;padding:8px;background:#fff3e0;border-radius:8px"><div style="font-size:11px;color:var(--muted)">${t("spent")}</div><div style="font-weight:700;color:var(--amber);font-size:13px">${rupee(p.spentAmount)}</div></div>
        <div style="text-align:center;padding:8px;background:#e3f2fd;border-radius:8px"><div style="font-size:11px;color:var(--muted)">${t("remaining")}</div><div style="font-weight:700;color:var(--blue);font-size:13px">${rupee(p.remainingAmount)}</div></div>
      </div>
      <div class="prog-bg"><div class="prog-fill" style="width:${pct}%;background:${barColor}"></div></div>
      <div style="font-size:11px;color:var(--muted);text-align:right">${pct}% ${t("utilised")}</div>
      ${p.fundSource?`<div style="font-size:12px;color:var(--muted)">💸 ${p.fundSource}</div>`:""}
      ${isAdmin()?`<div style="display:flex;gap:6px;margin-top:4px">
        <button class="btn btn-sm btn-amber" onclick='openEdit(${JSON.stringify(p).replace(/"/g,"&quot;")})'>${t("edit")}</button>
        <button class="btn btn-sm btn-red" onclick="deleteProject(${p.id})">${t("delete")}</button>
      </div>`:""}
    </div>`;
  }).join('')+'</div>';
}

function openModal(p=null){editId=p?p.id:null;document.getElementById("fYear").value=p?.financialYear||document.getElementById("yearFilter").value;document.getElementById("fCat").value=p?.category||"";document.getElementById("fProject").value=p?.projectName||"";document.getElementById("fDesc").value=p?.description||"";document.getElementById("fAlloc").value=p?.allocatedAmount||"";document.getElementById("fSpent").value=p?.spentAmount||"";document.getElementById("fStatus").value=p?.status||"PLANNED";document.getElementById("fFund").value=p?.fundSource||"";document.getElementById("fRemarks").value=p?.remarks||"";document.getElementById("modal").classList.remove("hidden");}
function openEdit(p){openModal(p);}
function closeModal(){document.getElementById("modal").classList.add("hidden");}
async function saveProject(){
  const body={financialYear:document.getElementById("fYear").value,category:document.getElementById("fCat").value,projectName:document.getElementById("fProject").value,description:document.getElementById("fDesc").value,allocatedAmount:parseFloat(document.getElementById("fAlloc").value),spentAmount:parseFloat(document.getElementById("fSpent").value)||0,status:document.getElementById("fStatus").value,fundSource:document.getElementById("fFund").value,remarks:document.getElementById("fRemarks").value};
  if(!body.projectName||!body.category||isNaN(body.allocatedAmount)){toast(getLang()==="te"?"తప్పనిసరి ఫీల్డ్‌లు పూరించండి":"Fill required fields","error");return;}
  try{if(editId)await api("PUT",`/api/budget/${editId}`,body);else await api("POST","/api/budget",body);toast(t("save"));closeModal();loadAll();}catch(e){toast(e.message,"error");}
}
async function deleteProject(id){if(!confirm(getLang()==="te"?"తొలగించాలా?":"Delete?"))return;try{await api("DELETE",`/api/budget/${id}`);toast(t("delete"));loadAll();}catch(e){toast(e.message,"error");}}
loadAll();
</script>
</body></html>
