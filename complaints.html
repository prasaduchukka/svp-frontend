<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Complaints — Smart Village Portal</title>
<link rel="stylesheet" href="style.css">
</head><body>
<script src="config.js"></script><script src="lang.js"></script><script src="navbar.js"></script>
<script>renderNav("complaints")</script>
<div class="page">
  <div class="page-header">
    <h1>📢 <span id="pageTitle"></span></h1>
    <button class="btn btn-primary" id="submitBtn" onclick="document.getElementById('submitModal').classList.remove('hidden')"></button>
  </div>
  <div class="stats-row" id="complaintStats"></div>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('',this)" id="tabAll"></button>
    <button class="tab-btn" onclick="switchTab('PENDING',this)" id="tabPending"></button>
    <button class="tab-btn" onclick="switchTab('IN_PROGRESS',this)" id="tabProgress"></button>
    <button class="tab-btn" onclick="switchTab('RESOLVED',this)" id="tabResolved"></button>
  </div>
  <div id="listWrap"></div>
</div>

<!-- Submit Modal -->
<div class="modal-overlay hidden" id="submitModal">
  <div class="modal">
    <div class="modal-header"><h2 id="submitTitle"></h2><button class="modal-close" onclick="document.getElementById('submitModal').classList.add('hidden')">✕</button></div>
    <div class="form-row">
      <div class="form-group"><label id="lbl-name"></label><input id="cName"/></div>
      <div class="form-group"><label id="lbl-phone"></label><input id="cPhone"/></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label id="lbl-cat"></label>
        <select id="cCat"><option value="" id="opt-select"></option></select>
      </div>
      <div class="form-group"><label id="lbl-subject"></label><input id="cSubject"/></div>
    </div>
    <div class="form-group"><label id="lbl-desc"></label><textarea id="cDesc"></textarea></div>
    <div class="form-group">
      <label id="lbl-photo"></label>
      <div class="upload-zone" id="uploadZone" onclick="document.getElementById('cImage').click()">
        <input type="file" id="cImage" accept="image/*" onchange="previewImage(this)"/>
        <div id="uploadPrompt"><div style="font-size:26px;margin-bottom:5px">📷</div><div style="font-size:13px;color:var(--muted)" id="uploadText"></div><div style="font-size:11px;color:var(--muted);margin-top:3px">JPG, PNG — max 5MB</div></div>
        <img id="imagePreview" class="upload-preview"/>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="btnCancel" onclick="document.getElementById('submitModal').classList.add('hidden')"></button>
      <button class="btn btn-primary" id="btnSubmit" onclick="submitComplaint()"></button>
    </div>
  </div>
</div>

<!-- Resolve Modal -->
<div class="modal-overlay hidden" id="resolveModal">
  <div class="modal">
    <div class="modal-header"><h2 id="resolveTitle"></h2><button class="modal-close" onclick="document.getElementById('resolveModal').classList.add('hidden')">✕</button></div>
    <div class="form-group"><label id="lbl-status"></label>
      <select id="rStatus">
        <option value="IN_PROGRESS" id="opt-progress"></option>
        <option value="RESOLVED" id="opt-resolved"></option>
        <option value="REJECTED" id="opt-rejected"></option>
      </select>
    </div>
    <div class="form-group"><label id="lbl-resolution"></label><textarea id="rNote"></textarea></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="btnCancelR" onclick="document.getElementById('resolveModal').classList.add('hidden')"></button>
      <button class="btn btn-primary" id="btnSaveR" onclick="saveResolve()"></button>
    </div>
  </div>
</div>

<!-- Image View Modal -->
<div class="modal-overlay hidden" id="imgModal">
  <div class="modal" style="text-align:center;max-width:680px">
    <div class="modal-header"><h2>📷 Photo</h2><button class="modal-close" onclick="document.getElementById('imgModal').classList.add('hidden')">✕</button></div>
    <img id="imgModalSrc" style="max-width:100%;border-radius:10px;max-height:65vh;object-fit:contain"/>
  </div>
</div>

<script>
let currentFilter="", resolveId=null;
const imgStore={};

function applyLang(){
  document.getElementById("pageTitle").textContent  = t("complaints");
  document.getElementById("submitBtn").textContent  = t("submit_complaint");
  document.getElementById("tabAll").textContent     = t("all");
  document.getElementById("tabPending").textContent = "🔴 " + t("pending");
  document.getElementById("tabProgress").textContent= "🔵 " + t("in_progress");
  document.getElementById("tabResolved").textContent= "🟢 " + t("resolved");
  document.getElementById("submitTitle").textContent= "📢 " + t("submit_complaint");
  document.getElementById("lbl-name").textContent   = t("your_name");
  document.getElementById("lbl-phone").textContent  = t("phone");
  document.getElementById("lbl-cat").textContent    = t("complaint_cat");
  document.getElementById("lbl-subject").textContent= t("subject");
  document.getElementById("lbl-desc").textContent   = t("description");
  document.getElementById("lbl-photo").textContent  = t("photo_optional");
  document.getElementById("uploadText").textContent = t("upload_photo");
  document.getElementById("btnCancel").textContent  = t("cancel");
  document.getElementById("btnSubmit").textContent  = t("submit");
  document.getElementById("resolveTitle").textContent= "✅ " + t("update_status");
  document.getElementById("lbl-status").textContent = t("status");
  document.getElementById("lbl-resolution").textContent = t("resolution_note");
  document.getElementById("btnCancelR").textContent = t("cancel");
  document.getElementById("btnSaveR").textContent   = t("save");
  document.getElementById("opt-select").textContent = getLang()==="te" ? "వర్గం ఎంచుకోండి" : "Select category";
  document.getElementById("opt-progress").textContent= "🔵 " + t("in_progress");
  document.getElementById("opt-resolved").textContent= "🟢 " + t("resolved");
  document.getElementById("opt-rejected").textContent= "🔴 " + t("rejected");

  // Populate category dropdown
  const cats = [
    ["ROADS",t("roads")],["WATER_SUPPLY",t("water_supply")],["ELECTRICITY",t("electricity")],
    ["SANITATION",t("sanitation")],["DRAINAGE",t("drainage")],["STREET_LIGHTS",t("street_lights")],
    ["LAND_DISPUTE",t("land_dispute")],["OTHER",t("other")]
  ];
  const sel = document.getElementById("cCat");
  sel.innerHTML = `<option value="">${getLang()==="te"?"వర్గం ఎంచుకోండి":"Select category"}</option>` +
    cats.map(([v,l])=>`<option value="${v}">${l}</option>`).join("");
}
applyLang();

function switchTab(f,btn){currentFilter=f;document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));btn.classList.add("active");load();}

function previewImage(input){
  const file=input.files[0];if(!file)return;
  if(file.size>5*1024*1024){toast("Image must be under 5MB","error");input.value="";return;}
  const reader=new FileReader();
  reader.onload=e=>{const preview=document.getElementById("imagePreview");preview.src=e.target.result;preview.style.display="block";document.getElementById("uploadPrompt").style.display="none";document.getElementById("uploadZone").classList.add("has-file");};
  reader.readAsDataURL(file);
}

const statusBadge={PENDING:"badge-amber",IN_PROGRESS:"badge-blue",RESOLVED:"badge-green",REJECTED:"badge-red"};

async function load(){
  const el=document.getElementById("listWrap");
  el.innerHTML=`<div style="color:var(--muted);padding:20px">${t("loading")}</div>`;
  try{
    const path=currentFilter?`/api/complaints?status=${currentFilter}`:"/api/complaints";
    const [data,all]=await Promise.all([api("GET",path),api("GET","/api/complaints")]);

    const counts={PENDING:0,IN_PROGRESS:0,RESOLVED:0,REJECTED:0};
    all.forEach(c=>{if(counts[c.status]!==undefined)counts[c.status]++;});
    document.getElementById("complaintStats").innerHTML=`
      <div class="stat-card"><div class="stat-icon" style="background:#fff3e0">🔴</div><div><div class="stat-val" style="color:var(--amber)">${counts.PENDING}</div><div class="stat-lbl">${t("pending")}</div></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:#e3f2fd">🔵</div><div><div class="stat-val" style="color:var(--blue)">${counts.IN_PROGRESS}</div><div class="stat-lbl">${t("in_progress")}</div></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:#e8f5e9">🟢</div><div><div class="stat-val" style="color:var(--green)">${counts.RESOLVED}</div><div class="stat-lbl">${t("resolved")}</div></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:#ffebee">⛔</div><div><div class="stat-val" style="color:var(--red)">${counts.REJECTED}</div><div class="stat-lbl">${t("rejected")}</div></div></div>`;

    if(!data.length){el.innerHTML=`<div class="empty"><div class="ei">📢</div><p>${t("no_complaints")}</p></div>`;return;}
    el.innerHTML='<div class="card-grid">'+data.map(c=>{
      const img=imgStore[c.id];
      return `<div class="card" style="display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
          <div style="font-weight:700;font-size:14px">${c.subject}</div>
          <span class="badge ${statusBadge[c.status]||'badge-gray'}" style="flex-shrink:0">${c.status.replace("_"," ")}</span>
        </div>
        <span class="badge badge-gray">${c.category.replace("_"," ")}</span>
        <div style="font-size:13px;color:var(--muted)">👤 ${c.complainantName} ${c.phone?"· 📞 "+c.phone:""}</div>
        <div style="font-size:13px;color:#444;line-height:1.5">${c.description}</div>
        ${img?`<img src="${img}" style="width:100%;max-height:130px;object-fit:cover;border-radius:8px;cursor:pointer;border:1px solid var(--border)" onclick="viewImg('${c.id}')"/>`:""}
        ${c.resolutionNote?`<div style="background:#e8f5e9;padding:9px 11px;border-radius:8px;font-size:13px;color:#1b5e20;border-left:3px solid var(--green)"><b>${t("resolution")}:</b> ${c.resolutionNote}</div>`:""}
        <div style="font-size:12px;color:var(--muted)">📅 ${t("submitted")}: ${formatDate(c.createdAt)}</div>
        ${isAdmin()&&c.status!=="RESOLVED"?`<div style="margin-top:4px"><button class="btn btn-sm btn-teal" onclick="openResolve(${c.id})">${t("update_status")}</button></div>`:""}
      </div>`;
    }).join('')+'</div>';
  }catch(e){el.innerHTML=`<div class="empty"><p>${e.message}</p></div>`;}
}

async function submitComplaint(){
  const name=document.getElementById("cName").value.trim();
  const cat=document.getElementById("cCat").value;
  const subject=document.getElementById("cSubject").value.trim();
  const desc=document.getElementById("cDesc").value.trim();
  if(!name||!cat||!subject||!desc){toast(getLang()==="te"?"అన్ని తప్పనిసరి ఫీల్డ్‌లు పూరించండి":"Fill all required fields","error");return;}
  try{
    const saved=await api("POST","/api/complaints",{complainantName:name,phone:document.getElementById("cPhone").value,category:cat,subject,description:desc});
    const imgFile=document.getElementById("cImage").files[0];
    if(imgFile&&saved&&saved.id){const reader=new FileReader();reader.onload=e=>{imgStore[saved.id]=e.target.result;};reader.readAsDataURL(imgFile);}
    toast(getLang()==="te"?"ఫిర్యాదు విజయవంతంగా సమర్పించబడింది!":"Complaint submitted successfully!");
    document.getElementById("submitModal").classList.add("hidden");
    ["cName","cPhone","cSubject","cDesc"].forEach(id=>document.getElementById(id).value="");
    document.getElementById("cCat").value="";
    document.getElementById("cImage").value="";
    document.getElementById("imagePreview").style.display="none";
    document.getElementById("uploadPrompt").style.display="block";
    document.getElementById("uploadZone").classList.remove("has-file");
    load();
  }catch(e){toast(e.message,"error");}
}

function openResolve(id){resolveId=id;document.getElementById("rNote").value="";document.getElementById("resolveModal").classList.remove("hidden");}
async function saveResolve(){
  const note=document.getElementById("rNote").value.trim();
  const status=document.getElementById("rStatus").value;
  if(!note){toast(getLang()==="te"?"పరిష్కార గమనిక నమోదు చేయండి":"Enter resolution note","error");return;}
  try{await api("PUT",`/api/complaints/${resolveId}/resolve`,{resolutionNote:note,status});toast(t("save"));document.getElementById("resolveModal").classList.add("hidden");load();}catch(e){toast(e.message,"error");}
}
function viewImg(id){const img=imgStore[id];if(!img)return;document.getElementById("imgModalSrc").src=img;document.getElementById("imgModal").classList.remove("hidden");}
load();
</script>
</body></html>
