<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Complaints — Smart Village Portal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script src="config.js"></script><script src="navbar.js"></script><script>renderNav("complaints")</script>

<div class="page">
  <div class="page-header">
    <h1><span class="ph-icon">📢</span> Complaints & Grievances</h1>
    <button class="btn btn-primary" onclick="document.getElementById('submitModal').classList.remove('hidden')">＋ Submit Complaint</button>
  </div>

  <div class="stats-row" id="complaintStats"></div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('',this)">All</button>
    <button class="tab-btn" onclick="switchTab('PENDING',this)">🔴 Pending</button>
    <button class="tab-btn" onclick="switchTab('IN_PROGRESS',this)">🔵 In Progress</button>
    <button class="tab-btn" onclick="switchTab('RESOLVED',this)">🟢 Resolved</button>
  </div>

  <div id="listWrap"></div>
</div>

<!-- ═══ SUBMIT COMPLAINT MODAL ═══ -->
<div class="modal-overlay hidden" id="submitModal">
  <div class="modal">
    <div class="modal-header">
      <h2>📢 Submit a Complaint</h2>
      <button class="modal-close" onclick="document.getElementById('submitModal').classList.add('hidden')">✕</button>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Your Name *</label><input id="cName" placeholder="Full name"/></div>
      <div class="form-group"><label>Phone</label><input id="cPhone" placeholder="Mobile number"/></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Category *</label>
        <select id="cCat">
          <option value="">Select category</option>
          <option value="ROADS">🛣️ Roads</option>
          <option value="WATER_SUPPLY">💧 Water Supply</option>
          <option value="ELECTRICITY">⚡ Electricity</option>
          <option value="SANITATION">🧹 Sanitation</option>
          <option value="DRAINAGE">🚰 Drainage</option>
          <option value="STREET_LIGHTS">💡 Street Lights</option>
          <option value="LAND_DISPUTE">📋 Land Dispute</option>
          <option value="OTHER">📌 Other</option>
        </select>
      </div>
      <div class="form-group"><label>Subject *</label><input id="cSubject" placeholder="Brief subject line"/></div>
    </div>
    <div class="form-group"><label>Description *</label><textarea id="cDesc" placeholder="Describe your issue in detail..."></textarea></div>

    <!-- IMAGE UPLOAD -->
    <div class="form-group">
      <label>Photo (Optional)</label>
      <div class="upload-zone" id="uploadZone" onclick="document.getElementById('cImage').click()">
        <input type="file" id="cImage" accept="image/*" onchange="previewImage(this)"/>
        <div id="uploadPrompt">
          <div style="font-size:28px;margin-bottom:6px">📷</div>
          <div style="font-size:13px;color:var(--muted)">Click to upload a photo of the issue</div>
          <div style="font-size:11px;color:var(--muted);margin-top:4px">JPG, PNG — max 5MB (optional)</div>
        </div>
        <img id="imagePreview" class="upload-preview"/>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="document.getElementById('submitModal').classList.add('hidden')">Cancel</button>
      <button class="btn btn-primary" onclick="submitComplaint()">Submit Complaint</button>
    </div>
  </div>
</div>

<!-- ═══ RESOLVE MODAL ═══ -->
<div class="modal-overlay hidden" id="resolveModal">
  <div class="modal">
    <div class="modal-header">
      <h2>✅ Update Complaint Status</h2>
      <button class="modal-close" onclick="document.getElementById('resolveModal').classList.add('hidden')">✕</button>
    </div>
    <div class="form-group"><label>New Status</label>
      <select id="rStatus">
        <option value="IN_PROGRESS">🔵 In Progress</option>
        <option value="RESOLVED">🟢 Resolved</option>
        <option value="REJECTED">🔴 Rejected</option>
      </select>
    </div>
    <div class="form-group"><label>Resolution Note *</label>
      <textarea id="rNote" placeholder="What action was taken or why it was rejected..."></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="document.getElementById('resolveModal').classList.add('hidden')">Cancel</button>
      <button class="btn btn-primary" onclick="saveResolve()">Save</button>
    </div>
  </div>
</div>

<!-- ═══ IMAGE VIEW MODAL ═══ -->
<div class="modal-overlay hidden" id="imgModal">
  <div class="modal" style="text-align:center;max-width:700px">
    <div class="modal-header">
      <h2>📷 Complaint Photo</h2>
      <button class="modal-close" onclick="document.getElementById('imgModal').classList.add('hidden')">✕</button>
    </div>
    <img id="imgModalSrc" style="max-width:100%;border-radius:10px;max-height:70vh;object-fit:contain"/>
  </div>
</div>

<script>
let currentFilter = "", resolveId = null;
// Store images locally per complaint (base64) since backend doesn't have image endpoint
const imgStore = {};

function switchTab(f, btn) {
  currentFilter = f;
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  load();
}

function previewImage(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { toast("Image must be under 5MB", "error"); input.value=""; return; }
  const reader = new FileReader();
  reader.onload = e => {
    const preview = document.getElementById("imagePreview");
    preview.src = e.target.result;
    preview.style.display = "block";
    document.getElementById("uploadPrompt").style.display = "none";
    document.getElementById("uploadZone").classList.add("has-file");
  };
  reader.readAsDataURL(file);
}

async function load() {
  const el = document.getElementById("listWrap");
  el.innerHTML = '<div style="color:var(--muted);padding:20px">Loading...</div>';
  try {
    const path = currentFilter ? `/api/complaints?status=${currentFilter}` : "/api/complaints";
    const [data, all] = await Promise.all([
      api("GET", path),
      api("GET", "/api/complaints")
    ]);

    // Stats
    const counts = { PENDING:0, IN_PROGRESS:0, RESOLVED:0, REJECTED:0 };
    all.forEach(c => { if(counts[c.status]!==undefined) counts[c.status]++; });
    document.getElementById("complaintStats").innerHTML = `
      <div class="stat-card">
        <div class="stat-icon" style="background:#fff3e0">🔴</div>
        <div><div class="stat-val" style="color:var(--amber)">${counts.PENDING}</div><div class="stat-lbl">Pending</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#e3f2fd">🔵</div>
        <div><div class="stat-val" style="color:var(--blue)">${counts.IN_PROGRESS}</div><div class="stat-lbl">In Progress</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#e8f5e9">🟢</div>
        <div><div class="stat-val" style="color:var(--green)">${counts.RESOLVED}</div><div class="stat-lbl">Resolved</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#ffebee">⛔</div>
        <div><div class="stat-val" style="color:var(--red)">${counts.REJECTED}</div><div class="stat-lbl">Rejected</div></div>
      </div>`;

    if (!data.length) { el.innerHTML='<div class="empty"><div class="ei">📢</div><p>No complaints found</p></div>'; return; }

    el.innerHTML = '<div class="card-grid">' + data.map(c => {
      const img = imgStore[c.id];
      return `
      <div class="card" style="display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
          <div style="font-weight:700;font-size:15px">${c.subject}</div>
          <span class="badge ${statusBadge(c.status)}" style="flex-shrink:0">${c.status.replace("_"," ")}</span>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <span class="badge badge-gray">${c.category.replace("_"," ")}</span>
        </div>
        <div style="font-size:13px;color:var(--muted)">👤 ${c.complainantName} ${c.phone?'&nbsp;·&nbsp; 📞 '+c.phone:''}</div>
        <div style="font-size:13px;color:#444;line-height:1.5">${c.description}</div>
        ${img?`<img src="${img}" style="width:100%;max-height:140px;object-fit:cover;border-radius:8px;cursor:pointer;border:1px solid var(--border)" onclick="viewImg('${c.id}')"/>`:''}
        ${c.resolutionNote?`<div style="background:#e8f5e9;padding:10px 12px;border-radius:8px;font-size:13px;color:#1b5e20;border-left:3px solid var(--green)"><b>Resolution:</b> ${c.resolutionNote}</div>`:''}
        <div style="font-size:12px;color:var(--muted)">📅 ${formatDate(c.createdAt)}</div>
        ${isAdmin()&&c.status!=="RESOLVED"?`<div style="margin-top:4px"><button class="btn btn-sm btn-teal" onclick="openResolve(${c.id})">Update Status</button></div>`:''}
      </div>`;
    }).join("") + "</div>";
  } catch(e) { el.innerHTML=`<div class="empty"><p>${e.message}</p></div>`; }
}

function statusBadge(s) {
  return {PENDING:"badge-amber",IN_PROGRESS:"badge-blue",RESOLVED:"badge-green",REJECTED:"badge-red"}[s]||"badge-gray";
}

async function submitComplaint() {
  const name    = document.getElementById("cName").value.trim();
  const cat     = document.getElementById("cCat").value;
  const subject = document.getElementById("cSubject").value.trim();
  const desc    = document.getElementById("cDesc").value.trim();
  if (!name||!cat||!subject||!desc) { toast("Fill all required fields","error"); return; }

  const body = { complainantName:name, phone:document.getElementById("cPhone").value, category:cat, subject, description:desc };
  try {
    const saved = await api("POST", "/api/complaints", body);
    // Save image locally if provided
    const imgFile = document.getElementById("cImage").files[0];
    if (imgFile && saved && saved.id) {
      const reader = new FileReader();
      reader.onload = e => { imgStore[saved.id] = e.target.result; };
      reader.readAsDataURL(imgFile);
    }
    toast("Complaint submitted! We will look into it.");
    document.getElementById("submitModal").classList.add("hidden");
    // reset form
    ["cName","cPhone","cSubject","cDesc"].forEach(id=>document.getElementById(id).value="");
    document.getElementById("cCat").value="";
    document.getElementById("cImage").value="";
    document.getElementById("imagePreview").style.display="none";
    document.getElementById("uploadPrompt").style.display="block";
    document.getElementById("uploadZone").classList.remove("has-file");
    load();
  } catch(e) { toast(e.message,"error"); }
}

function openResolve(id) {
  resolveId = id;
  document.getElementById("rNote").value="";
  document.getElementById("resolveModal").classList.remove("hidden");
}
async function saveResolve() {
  const note   = document.getElementById("rNote").value.trim();
  const status = document.getElementById("rStatus").value;
  if (!note) { toast("Enter a resolution note","error"); return; }
  try {
    await api("PUT", `/api/complaints/${resolveId}/resolve`, { resolutionNote:note, status });
    toast("Complaint updated!");
    document.getElementById("resolveModal").classList.add("hidden");
    load();
  } catch(e) { toast(e.message,"error"); }
}

function viewImg(id) {
  const img = imgStore[id];
  if (!img) return;
  document.getElementById("imgModalSrc").src = img;
  document.getElementById("imgModal").classList.remove("hidden");
}

load();
</script>
</body>
</html>
