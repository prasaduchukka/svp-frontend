<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Smart Village Portal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script src="config.js"></script><script src="navbar.js"></script>
<script>if(!getToken()||!isAdmin()) window.location.href="login.html"; renderNav("admin");</script>

<div class="page">
  <div class="page-header">
    <h1><span class="ph-icon">⚙️</span> Admin Dashboard</h1>
    <span class="badge badge-green" id="adminBadge"></span>
  </div>

  <!-- Stats -->
  <div class="stats-row" id="dashStats"></div>

  <!-- Quick Actions -->
  <div class="section-head" style="margin-bottom:16px"><h2>Quick Actions</h2><div class="section-line"></div></div>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:28px">
    <a href="meetings.html"   class="module-card"><div class="mc-icon" style="background:#e8f5e9">📅</div><div class="mc-label">Meetings</div></a>
    <a href="complaints.html" class="module-card"><div class="mc-icon" style="background:#ffebee">📢</div><div class="mc-label">Complaints</div></a>
    <a href="businesses.html" class="module-card"><div class="mc-icon" style="background:#fff3e0">🛒</div><div class="mc-label">Businesses</div></a>
    <a href="schemes.html"    class="module-card"><div class="mc-icon" style="background:#e3f2fd">📋</div><div class="mc-label">Schemes</div></a>
    <a href="budget.html"     class="module-card"><div class="mc-icon" style="background:#e8f5e9">💰</div><div class="mc-label">Budget</div></a>
    <a href="festivals.html"  class="module-card"><div class="mc-icon" style="background:#f3e5f5">🎉</div><div class="mc-label">Festivals</div></a>
    <a href="education.html"  class="module-card"><div class="mc-icon" style="background:#e3f2fd">📚</div><div class="mc-label">Education</div></a>
    <a href="tourists.html"   class="module-card"><div class="mc-icon" style="background:#e0f2f1">📍</div><div class="mc-label">Tourism</div></a>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
    <!-- Register user -->
    <div class="card">
      <div class="section-head" style="margin-bottom:16px"><h2>👤 Register New User</h2></div>
      <div class="form-group"><label>Full Name *</label><input id="rFullName" placeholder="Full name"/></div>
      <div class="form-group"><label>Username *</label><input id="rUsername" placeholder="Login username"/></div>
      <div class="form-group"><label>Password *</label><input id="rPassword" type="password" placeholder="Min 6 characters"/></div>
      <div class="form-group"><label>Phone</label><input id="rPhone" placeholder="Mobile number"/></div>
      <div class="form-group"><label>Role *</label>
        <select id="rRole">
          <option value="CITIZEN">Citizen (read-only)</option>
          <option value="BUSINESS_OWNER">Business Owner</option>
          <option value="PANCHAYAT">Panchayat Staff</option>
          <option value="ADMIN">Admin</option>
        </select>
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="registerUser()">Register User</button>
    </div>

    <!-- Pending complaints -->
    <div class="card">
      <div class="section-head" style="margin-bottom:16px"><h2>🔴 Pending Complaints</h2><div class="section-line"></div><a href="complaints.html" style="font-size:13px;color:var(--green);text-decoration:none">View all →</a></div>
      <div id="pendingComplaints"><div style="color:var(--muted);font-size:13px">Loading...</div></div>
    </div>
  </div>
</div>

<script>
const user=getUser();
if(user) document.getElementById("adminBadge").textContent=`${user.fullName} — ${user.role}`;

async function loadDash(){
  try{
    const [meetings,complaints,businesses,schemes,budget]=await Promise.all([
      api("GET","/api/meetings"),api("GET","/api/complaints"),
      api("GET","/api/businesses"),api("GET","/api/schemes"),api("GET","/api/budget")
    ]);
    const pending=complaints.filter(c=>c.status==="PENDING");
    const resolved=complaints.filter(c=>c.status==="RESOLVED");
    const openBiz=businesses.filter(b=>b.open);

    document.getElementById("dashStats").innerHTML=`
      <div class="stat-card"><div class="stat-icon" style="background:#e8f5e9">📅</div><div><div class="stat-val" style="color:var(--green)">${meetings.length}</div><div class="stat-lbl">Total Meetings</div></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:#ffebee">🔴</div><div><div class="stat-val" style="color:var(--red)">${pending.length}</div><div class="stat-lbl">Pending Complaints</div></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:#e8f5e9">✅</div><div><div class="stat-val" style="color:var(--green)">${resolved.length}</div><div class="stat-lbl">Resolved</div></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:#fff3e0">🛒</div><div><div class="stat-val" style="color:var(--amber)">${openBiz.length}</div><div class="stat-lbl">Open Shops</div></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:#e3f2fd">📋</div><div><div class="stat-val" style="color:var(--blue)">${schemes.length}</div><div class="stat-lbl">Active Schemes</div></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:#f3e5f5">💰</div><div><div class="stat-val" style="color:var(--purple)">${budget.length}</div><div class="stat-lbl">Budget Projects</div></div></div>`;

    const pc=document.getElementById("pendingComplaints");
    if(!pending.length){
      pc.innerHTML='<div class="empty" style="padding:20px"><div class="ei">✅</div><p>No pending complaints!</p></div>';
    } else {
      pc.innerHTML='<div style="display:flex;flex-direction:column;gap:8px;max-height:300px;overflow-y:auto">'+
        pending.slice(0,8).map(c=>`
          <div style="padding:10px 12px;background:var(--bg);border-radius:10px;border-left:3px solid var(--amber);border:1px solid var(--border)">
            <div style="font-weight:600;font-size:13px">${c.subject}</div>
            <div style="font-size:12px;color:var(--muted);margin-top:2px">${c.category.replace("_"," ")} · ${c.complainantName}</div>
            <div style="font-size:12px;color:var(--muted)">${formatDate(c.createdAt)}</div>
            <a href="complaints.html" class="btn btn-xs btn-amber" style="margin-top:6px">Resolve →</a>
          </div>`).join('')+
        '</div>'+
        (pending.length>8?`<div style="font-size:12px;color:var(--muted);margin-top:8px">+${pending.length-8} more complaints</div>`:'');
    }
  }catch(e){console.error(e);}
}

async function registerUser(){
  const body={fullName:document.getElementById("rFullName").value,username:document.getElementById("rUsername").value,password:document.getElementById("rPassword").value,phone:document.getElementById("rPhone").value,role:document.getElementById("rRole").value};
  if(!body.fullName||!body.username||!body.password){toast("Fill required fields","error");return;}
  if(body.password.length<6){toast("Password must be at least 6 characters","error");return;}
  try{
    await api("POST","/api/auth/register",body);
    toast(`User '${body.username}' registered as ${body.role}!`);
    ["rFullName","rUsername","rPassword","rPhone"].forEach(id=>document.getElementById(id).value="");
  }catch(e){toast(e.message,"error");}
}
loadDash();
</script>
</body>
</html>
