<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Village Portal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script src="config.js"></script><script src="lang.js"></script><script src="navbar.js"></script>
<script>renderNav("home")</script>
<div class="page">

  <div class="hero">
    <div class="hero-title" id="heroTitle"></div>
    <div class="hero-sub" id="heroSub"></div>
    <div class="hero-quote">
      <span class="te-quote" id="heroQuote"></span>
      <span class="en-quote" id="heroQuoteEn"></span>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat-card"><div class="stat-icon" style="background:#e8f5e9">📅</div><div><div class="stat-val" id="sMeetings" style="color:var(--green)">—</div><div class="stat-lbl" id="lbl-meetings"></div></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:#ffebee">📢</div><div><div class="stat-val" id="sComplaints" style="color:var(--red)">—</div><div class="stat-lbl" id="lbl-complaints"></div></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:#fff3e0">🛒</div><div><div class="stat-val" id="sBusinesses" style="color:var(--amber)">—</div><div class="stat-lbl" id="lbl-businesses"></div></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:#e3f2fd">📋</div><div><div class="stat-val" id="sSchemes" style="color:var(--blue)">—</div><div class="stat-lbl" id="lbl-schemes"></div></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:#f3e5f5">🎉</div><div><div class="stat-val" id="sFestivals" style="color:var(--purple)">—</div><div class="stat-lbl" id="lbl-festivals"></div></div></div>
  </div>

  <div class="section-head" style="margin-bottom:14px"><h2 id="quickAccess"></h2><div class="section-line"></div></div>
  <div class="module-grid" style="margin-bottom:24px">
    <a class="module-card" href="meetings.html">  <div class="mc-icon" style="background:#e8f5e9">📅</div><div class="mc-label" id="mc-meetings"></div></a>
    <a class="module-card" href="complaints.html"><div class="mc-icon" style="background:#ffebee">📢</div><div class="mc-label" id="mc-complaints"></div></a>
    <a class="module-card" href="businesses.html"><div class="mc-icon" style="background:#fff3e0">🛒</div><div class="mc-label" id="mc-businesses"></div></a>
    <a class="module-card" href="schemes.html">   <div class="mc-icon" style="background:#e3f2fd">📋</div><div class="mc-label" id="mc-schemes"></div></a>
    <a class="module-card" href="budget.html">    <div class="mc-icon" style="background:#e8f5e9">💰</div><div class="mc-label" id="mc-budget"></div></a>
    <a class="module-card" href="festivals.html"> <div class="mc-icon" style="background:#f3e5f5">🎉</div><div class="mc-label" id="mc-festivals"></div></a>
    <a class="module-card" href="education.html"> <div class="mc-icon" style="background:#e3f2fd">📚</div><div class="mc-label" id="mc-education"></div></a>
    <a class="module-card" href="tourists.html">  <div class="mc-icon" style="background:#e0f2f1">📍</div><div class="mc-label" id="mc-tourism"></div></a>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px" class="home-bottom-grid">
    <div class="card">
      <div class="section-head" style="margin-bottom:12px"><h2 id="officialsTitle"></h2></div>
      <div class="official-card">
        <div class="official-avatar">👨</div>
        <div class="official-info"><div class="name">Mr. Ramesh Kumar</div><div class="role" id="presidentRole"></div></div>
        <span class="badge badge-green" id="inOffice"></span>
      </div>
      <div class="official-card">
        <div class="official-avatar">👩</div>
        <div class="official-info"><div class="name">Ms. Lakshmi Devi</div><div class="role" id="vroRole"></div></div>
        <span class="badge badge-blue">Revenue</span>
      </div>
    </div>
    <div class="card">
      <div class="section-head" style="margin-bottom:12px"><h2 id="upcomingTitle"></h2><div class="section-line"></div><a href="meetings.html" style="font-size:12px;color:var(--green);text-decoration:none" id="viewAllLink"></a></div>
      <div id="homeMeetings"><div style="color:var(--muted);font-size:13px" id="loadingText"></div></div>
    </div>
  </div>

  <div class="card">
    <div class="section-head" style="margin-bottom:14px"><h2 id="faqTitle"></h2></div>
    <div style="display:flex;flex-direction:column;gap:8px" id="faqList"></div>
  </div>
</div>

<style>
@media(max-width:640px){
  .home-bottom-grid{grid-template-columns:1fr!important}
}
</style>

<script>
function applyLang() {
  document.getElementById("heroTitle").textContent    = t("village_name");
  document.getElementById("heroSub").textContent      = t("village_sub");
  document.getElementById("heroQuote").textContent    = "మన గ్రామ ప్రజలు బాధ్యతగా, పారదర్శకంగా మరియు ఐకమత్యంగా ఉండాలని నా కోరిక.";
  document.getElementById("heroQuoteEn").textContent  = '"My wish is that the people of our village be responsible, transparent and united."';
  document.getElementById("lbl-meetings").textContent  = t("upcoming_meetings");
  document.getElementById("lbl-complaints").textContent= t("open_complaints");
  document.getElementById("lbl-businesses").textContent= t("village_businesses");
  document.getElementById("lbl-schemes").textContent   = t("govt_schemes");
  document.getElementById("lbl-festivals").textContent = t("upcoming_festivals");
  document.getElementById("quickAccess").textContent   = t("quick_access");
  document.getElementById("mc-meetings").textContent   = t("meetings");
  document.getElementById("mc-complaints").textContent = t("complaints");
  document.getElementById("mc-businesses").textContent = t("businesses");
  document.getElementById("mc-schemes").textContent    = t("schemes");
  document.getElementById("mc-budget").textContent     = t("budget");
  document.getElementById("mc-festivals").textContent  = t("festivals");
  document.getElementById("mc-education").textContent  = t("education");
  document.getElementById("mc-tourism").textContent    = t("tourism");
  document.getElementById("officialsTitle").textContent= t("village_officials");
  document.getElementById("presidentRole").textContent = t("president");
  document.getElementById("vroRole").textContent       = t("vro");
  document.getElementById("inOffice").textContent      = t("in_office");
  document.getElementById("upcomingTitle").textContent = t("upcoming_meetings");
  document.getElementById("viewAllLink").textContent   = t("view_all");
  document.getElementById("loadingText").textContent   = t("loading");
  document.getElementById("faqTitle").textContent      = t("faq");

  const faqs = getLang()==="te" ? [
    ["🗺️ చినభోగిలి ఎక్కడ ఉంది?","సీతానగరం మండలం", "విజయనగరం జిల్లా, ఆంధ్రప్రదేశ్. పిన్: 535546."],
    ["📢 ఫిర్యాదు ఎలా సమర్పించాలి?","ఫిర్యాదులు విభాగానికి వెళ్ళి ఫారమ్ పూరించండి. లాగిన్ అవసరం లేదు."],
    ["📋 ప్రభుత్వ పథకాల అర్హత ఎలా తనిఖీ చేయాలి?","పథకాలు పేజీకి వెళ్ళి లింగం, వయసు, ఆదాయం నమోదు చేయండి."],
    ["💰 పంచాయతీ డబ్బు ఎలా ఖర్చవుతుందో ఎలా తెలుసుకోవాలి?","బడ్జెట్ పారదర్శకత పేజీలో అన్ని ప్రాజెక్టుల వివరాలు చూడవచ్చు."],
  ] : [
    ["🗺️ Where is Chinabhogila located?","Seethanagaram Mandal, Vizianagaram District, Andhra Pradesh. PIN: 535546."],
    ["📢 How do I submit a complaint?","Go to Complaints section and fill the form. No login needed. You can also attach a photo."],
    ["📋 How to check government scheme eligibility?","Visit Govt Schemes → fill gender, age, income → instantly see matching schemes."],
    ["💰 How is panchayat money being spent?","Budget Transparency page shows every project, fund allocated and amount spent."],
  ];
  document.getElementById("faqList").innerHTML = faqs.map(([q,a])=>`
    <details style="border:1px solid var(--border);border-radius:10px;padding:12px 14px">
      <summary style="cursor:pointer;font-weight:600;font-size:14px;list-style:none">${q}</summary>
      <p style="margin-top:8px;font-size:13px;color:var(--muted);line-height:1.6">${a}</p>
    </details>`).join("");
}
applyLang();

async function loadStats() {
  try {
    const [meetings,complaints,businesses,schemes,festivals] = await Promise.all([
      api("GET","/api/meetings/upcoming"), api("GET","/api/complaints?status=PENDING"),
      api("GET","/api/businesses"),        api("GET","/api/schemes"),
      api("GET","/api/festivals/upcoming")
    ]);
    document.getElementById("sMeetings").textContent   = meetings.length;
    document.getElementById("sComplaints").textContent = complaints.length;
    document.getElementById("sBusinesses").textContent = businesses.length;
    document.getElementById("sSchemes").textContent    = schemes.length;
    document.getElementById("sFestivals").textContent  = festivals.length;

    const el = document.getElementById("homeMeetings");
    if(!meetings.length){
      el.innerHTML=`<div class="empty" style="padding:16px"><div class="ei">📅</div><p>${t("no_meetings")}</p></div>`;return;
    }
    el.innerHTML = meetings.slice(0,3).map(m=>`
      <div style="padding:9px 0;border-bottom:1px solid var(--border)">
        <div style="font-weight:600;font-size:13px">${m.title}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:2px">📅 ${formatDateTime(m.meetingDate)} · 📍 ${m.location||"Village Hall"}</div>
      </div>`).join("");
  } catch(e){ console.log(e.message); }
}
loadStats();
</script>
</body>
</html>
